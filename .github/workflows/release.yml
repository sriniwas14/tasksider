name: Build & Release All Platforms

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: 'macOS (Universal DMG & App)'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            name: 'Linux (AppImage & DEB)'
            args: ''
          - platform: 'windows-latest'
            name: 'Windows (EXE & MSI)'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libgtk-layer-shell-dev

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build Tauri and Publish to GitHub Releases
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Tasksider v__VERSION__'
          releaseBody: |
            ### 📋 Tasksider v__VERSION__
            
            Cross-platform desktop sidebar task manager for **macOS**, **Linux**, and **Windows**.
            
            #### 📦 Downloads
            - 🍏 **macOS**: `Tasksider_universal.dmg` (Universal binary for Apple Silicon & Intel)
            - 🐧 **Linux**: `Tasksider_amd64.AppImage` (portable) and `.deb` (Debian/Ubuntu)
            - 🪟 **Windows**: `Tasksider_x64-setup.exe` (NSIS installer) and `.msi`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tasksider-${{ matrix.platform }}-bundles
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/universal-apple-darwin/release/bundle/
          if-no-files-found: ignore
