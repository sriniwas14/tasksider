name: Build macOS Application

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Frontend Dependencies
        run: bun install

      - name: Build macOS Universal App & DMG
        run: bun run tauri build --target universal-apple-darwin

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasksider-macOS-Universal-DMG
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload .app Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Tasksider-macOS-Universal-App
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
